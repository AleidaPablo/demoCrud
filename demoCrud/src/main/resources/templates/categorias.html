<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías - Actividad 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">CRUD Spring Boot - VPS</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/productos}">Productos</a>
            <a class="nav-link active" th:href="@{/categorias}">Categorías</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0">Nueva Categoría</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="POST">
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label class="form-label">Nombre de Categoría</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Electrónica" />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Categoría</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0">Categorías Existentes</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-secondary">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${listaCategorias}">
                                <td th:text="${cat.id}">1</td>
                                <td th:text="${cat.nombre}">Electrónica</td>
                                <td>
                                    <a th:href="@{/categorias/eliminar/{id}(id=${cat.id})}" 
                                       class="btn btn-sm btn-danger" 
                                       onclick="return confirm('¿Eliminar categoría?')">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

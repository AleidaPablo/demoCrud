<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>
    <h1>Registro de productos</h1>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required />
        <br/><br/>
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" required />
        <br/><br/>
        <button type="submit">Guardar producto</button>
    </form>

    <h2>Productos registrados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${listaProductos}">
                <td th:text="${prod.id}"></td>
                <td th:text="${prod.nombre}"></td>
                <td th:text="${prod.precio}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
